# Compiles the RiaGraph engine, once per platform, for a release build.
#
# Everything else in release-build.yml (Python wheels, the Node.js binding, the
# Java native library, the Rust crate) links against what is built here instead
# of compiling the engine again. The archives keep the names that
# scripts/download-libriag.sh and the bindings' own download scripts look for.
#
#   libriag-<os>-<arch>                shared library + headers
#   libriag-static-<os>-<arch>[-compat] static library + headers (what the bindings link)
#   riag_cli-<os>-<arch>               the command line shell
#
# Linux is built in manylinux_2_28 with gcc-toolset-13 and -static-libstdc++, so
# the result loads on any glibc >= 2.28 system.
#
# Only the RiaGraph tree itself is needed: the engine does not use the
# submodules, so none are checked out here.
name: Build engine

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON list of platform objects from release-build.yml's plan job"
        required: true
        type: string
      sha:
        description: "Commit to build"
        required: true
        type: string

permissions:
  contents: read

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  engine:
    name: engine (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # ---- Dependencies -----------------------------------------------------

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          git config --global --add safe.directory '*'
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled powertools
          dnf install -y cmake ninja-build python3 python3-pip git gcc-toolset-13 openssl3 openssl3-devel pkg-config

      - name: Install uv (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv (macOS/Windows)
        if: runner.os != 'Linux'
        run: python3 -m pip install uv

      - name: Install OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        run: |
          # Pin to OpenSSL 3: Homebrew now also ships openssl@4, which CMake
          # would otherwise prefer. The build and all macOS packaging scripts
          # assume OpenSSL 3 (libssl.3/libcrypto.3), enforced by the version
          # guard in CMakeLists.txt. OPENSSL_ROOT_DIR is honored by CMake's
          # FindOpenSSL and propagated to `make` via the environment.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list ninja >/dev/null 2>&1 || brew install ninja
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Recent Windows images no longer ship C:/Program Files/OpenSSL,
          # so download the Shining Light Productions installer directly
          # (Inno Setup, silent).
          $url = "https://slproweb.com/download/${{ matrix.openssl_exe }}"
          $dst = "$env:RUNNER_TEMP\slp_openssl.exe"
          Invoke-WebRequest -Uri $url -OutFile $dst
          Start-Process -FilePath $dst -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          if (-not (Test-Path "C:\Program Files\OpenSSL\include\openssl\ssl.h")) {
            Write-Error "OpenSSL install not found at C:\Program Files\OpenSSL"
            exit 1
          }
          "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      # ---- Build ------------------------------------------------------------

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          source /opt/rh/gcc-toolset-13/enable
          export CC=gcc
          export CXX=g++
          export LDFLAGS="-static-libstdc++"
          # Ensure CMake finds OpenSSL 3 installed by openssl3 packages inside the manylinux container
          export EXTRA_CMAKE_FLAGS="-DOPENSSL_ROOT_DIR=/usr/lib64/openssl3 -DOPENSSL_INCLUDE_DIR=/usr/include/openssl3 -DOPENSSL_CRYPTO_LIBRARY=/usr/lib64/openssl3/libcrypto.so -DOPENSSL_SSL_LIBRARY=/usr/lib64/openssl3/libssl.so"
          make GEN=Ninja
          make install

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: 13.3
        run: |
          make GEN=Ninja
          make install

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          powershell.exe -Command "Add-MpPreference -ExclusionPath '${{ github.workspace }}'"
          make GEN=Ninja
          make install

      # ---- Collect artifacts ------------------------------------------------

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cp install/include/riag.h .
          cp install/include/riag.hpp .
          # Preserve the versioned SONAME symlink chain so that consumers
          # linking against libriag.so can resolve the SONAME (libriag.so.0)
          # at load time.
          cp -P install/lib*/libriag.so install/lib*/libriag.so.* .
          cp -L install/lib*/libriag.a .
          cp install/bin/riag .

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cp install/include/riag.h .
          cp install/include/riag.hpp .
          # Preserve the versioned install_name symlink chain so that consumers
          # linking against libriag.dylib can resolve @rpath/libriag.0.dylib
          # at load time.
          cp -P install/lib/libriag.dylib install/lib/libriag.*.dylib .
          cp -L install/lib/libriag.a .
          cp install/bin/riag .

      - name: Verify binary information (macOS)
        if: runner.os == 'macOS'
        run: |
          file -b riag
          otool -l riag | grep minos
          file -b libriag.dylib
          otool -l libriag.dylib | grep minos

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item install\include\riag.h .
          Copy-Item install\include\riag.hpp .
          Copy-Item install\bin\riag_shared.dll .
          Copy-Item install\lib\riag_shared.lib .
          Copy-Item install\lib\riag.lib .
          Copy-Item install\bin\riag_shell.exe riag.exe

      # ---- Archives ---------------------------------------------------------

      - name: Create tarballs (Linux)
        if: runner.os == 'Linux'
        run: |
          # libriag.so, libriag.so.0, libriag.so.0.15.3: unversioned link-time
          # name, SONAME, and real file. The latter two are symlinks preserved
          # by tar so that DT_NEEDED resolution works at load time.
          tar -czvf libriag-linux-${{ matrix.arch }}.tar.gz riag.h riag.hpp libriag.so libriag.so.*
          tar -czvf libriag-static-linux-${{ matrix.arch }}-compat.tar.gz riag.h riag.hpp libriag.a
          tar -czvf riag_cli-linux-${{ matrix.arch }}.tar.gz riag

      - name: Create tarballs (macOS)
        if: runner.os == 'macOS'
        run: |
          # libriag.dylib, libriag.0.dylib, libriag.0.15.3.dylib: unversioned
          # link-time name, install_name, and real file. The latter two are
          # symlinks preserved by tar so that LC_LOAD_DYLIB resolution works
          # at load time.
          tar -czvf libriag-osx-${{ matrix.arch }}.tar.gz riag.h riag.hpp libriag.dylib libriag.*.dylib
          tar -czvf libriag-static-osx-${{ matrix.arch }}.tar.gz riag.h riag.hpp libriag.a
          tar -czvf riag_cli-osx-${{ matrix.arch }}.tar.gz riag

      - name: Create zip files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path riag.h, riag.hpp, riag_shared.dll, riag_shared.lib -DestinationPath libriag-windows-${{ matrix.arch }}.zip
          Compress-Archive -Path riag.h, riag.hpp, riag.lib -DestinationPath libriag-static-windows-${{ matrix.arch }}.zip
          Compress-Archive -Path riag.exe -DestinationPath riag_cli-windows-${{ matrix.arch }}.zip

      # ---- Verify shared-library tarball self-consistency -------------------
      # Guards against the class of bug where the tarball's on-disk filenames
      # don't match the SONAME / install_name embedded in the shared library.
      # A consumer linking -lriag resolves the link-time name (libriag.so /
      # libriag.dylib) and stamps the SONAME / install_name into its own
      # binary; that stamped name is what the dynamic loader then looks up at
      # runtime, so it has to be present in the tarball too.

      - name: Verify tarball SONAME consistency (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tarball=libriag-linux-${{ matrix.arch }}.tar.gz
          soname=$(readelf -d libriag.so | awk '/\(SONAME\)/ {gsub(/[][]/,"",$NF); print $NF}')
          entries=$(tar -tzf "$tarball" | sort)
          printf 'SONAME: %s\n%s entries:\n%s\n' "$soname" "$tarball" "$entries"
          if ! grep -Fxq "$soname" <<<"$entries"; then
            echo "::error::SONAME '$soname' is not present as an entry in $tarball"
            exit 1
          fi

      - name: Verify tarball install_name consistency (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tarball=libriag-osx-${{ matrix.arch }}.tar.gz
          install_name=$(otool -D libriag.dylib | awk 'NR==2')
          base=$(basename "$install_name")
          entries=$(tar -tzf "$tarball" | sort)
          printf 'install_name: %s\nbasename: %s\n%s entries:\n%s\n' "$install_name" "$base" "$tarball" "$entries"
          if ! grep -Fxq "$base" <<<"$entries"; then
            echo "::error::install_name '$install_name' (basename '$base') is not present as an entry in $tarball"
            exit 1
          fi

      # ---- Upload -----------------------------------------------------------

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: libriag-linux-${{ matrix.arch }}
          path: libriag-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: libriag-static-linux-${{ matrix.arch }}-compat
          path: libriag-static-linux-${{ matrix.arch }}-compat.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: riag_cli-linux-${{ matrix.arch }}
          path: riag_cli-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: libriag-osx-${{ matrix.arch }}
          path: libriag-osx-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: libriag-static-osx-${{ matrix.arch }}
          path: libriag-static-osx-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: riag_cli-osx-${{ matrix.arch }}
          path: riag_cli-osx-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: libriag-windows-${{ matrix.arch }}
          path: libriag-windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: libriag-static-windows-${{ matrix.arch }}
          path: libriag-static-windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: riag_cli-windows-${{ matrix.arch }}
          path: riag_cli-windows-${{ matrix.arch }}.zip
